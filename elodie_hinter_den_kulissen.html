  <script>
  (function () {
    var box   = document.querySelector('.recorder');
    var svg   = box.querySelector('.recorder__svg');
    var audio = box.querySelector('.recorder__audio');
    var bar   = box.querySelector('.recorder__fortschritt');
    var zeit  = box.querySelector('.recorder__zeit');
    var bandL = svg.querySelectorAll('.recorder__band-l');
    var bandR = svg.querySelectorAll('.recorder__band-r');
    var leds  = Array.prototype.slice.call(svg.querySelectorAll('.recorder__vu rect'));
    var play  = svg.querySelector('[data-aktion="play"]');
    var R_MIN = 27, R_MAX = 35;              // Bandwickel: leer / voll
    var ruhig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    box.classList.add('mit-js');             // versteckt den normalen Player, zeigt Leiste
    audio.removeAttribute('controls');

    function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    function zeichnen() {
      var d = audio.duration || 0, p = d ? audio.currentTime / d : 0;
      var rl = R_MAX - (R_MAX - R_MIN) * p, rr = R_MIN + (R_MAX - R_MIN) * p;
      bandL.forEach(function (c) { c.setAttribute('r', rl.toFixed(2)); });
      bandR.forEach(function (c) { c.setAttribute('r', rr.toFixed(2)); });
      if (!ziehen) bar.value = Math.round(p * 1000);
      zeit.textContent = fmt(audio.currentTime) + ' / ' + fmt(d || 215);
    }

    // Aussteuerung: echte Lautstärke über Web Audio, sonst ein ruhiges Flackern
    var ctx = null, analyser = null, daten = null, stumm = 0;
    function audioAnalyse() {
      if (ctx || !(window.AudioContext || window.webkitAudioContext)) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        var quelle = ctx.createMediaElementSource(audio);
        analyser = ctx.createAnalyser(); analyser.fftSize = 512;
        quelle.connect(analyser); analyser.connect(ctx.destination);
        daten = new Uint8Array(analyser.fftSize);
      } catch (e) { analyser = null; }
    }
    function pegel() {
      if (analyser) {
        analyser.getByteTimeDomainData(daten);
        var sum = 0; for (var i = 0; i < daten.length; i++) { var v = (daten[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / daten.length);
        if (rms > 0.0005) { stumm = 0; return Math.min(1, rms * 3.2); }
        if (++stumm < 60) return 0;           // kurze Pause im Gespräch
      }
      return 0.35 + Math.random() * 0.35;     // Ersatz, falls der Browser nichts liefert
    }
    var anzeige = 0;
    function vu() {
      var ziel = audio.paused ? 0 : pegel();
      anzeige = ziel > anzeige ? ziel : anzeige * 0.88;     // schnell hoch, langsam runter
      var n = Math.round(anzeige * leds.length);
      leds.forEach(function (r, i) { r.classList.toggle('an', i < n); });
      zeichnen();
      if (!audio.paused || anzeige > 0.02) requestAnimationFrame(vu);
      else leds.forEach(function (r) { r.classList.remove('an'); });
    }

    function starten() {
      audioAnalyse();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      audio.play();
    }
    function stoppen() { audio.pause(); }

    audio.addEventListener('play', function () {
      svg.classList.add('laeuft'); play.classList.add('gedrueckt');
      if (!ruhig) requestAnimationFrame(vu);
      if (window.goatcounter && window.goatcounter.count && !audio.dataset.gezaehlt) {
        audio.dataset.gezaehlt = '1';
        window.goatcounter.count({ path: 'audio-elodie-wie-alles-begann', title: 'Audio abgespielt', event: true });
      }
    });
    audio.addEventListener('pause', function () { svg.classList.remove('laeuft'); play.classList.remove('gedrueckt'); zeichnen(); });
    audio.addEventListener('ended', function () { audio.currentTime = 0; zeichnen(); });
    audio.addEventListener('loadedmetadata', zeichnen);
    audio.addEventListener('timeupdate', function () { if (ruhig || audio.paused) zeichnen(); });

    svg.querySelectorAll('[data-aktion]').forEach(function (el) {
      function los() {
        var a = el.getAttribute('data-aktion');
        if (a === 'play') starten();
        else if (a === 'stop') stoppen();
        else audio.paused ? starten() : stoppen();
      }
      el.addEventListener('click', los);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); los(); }
      });
    });

    // Spulen per Schieberegler
    var ziehen = false;
    bar.addEventListener('input', function () {
      ziehen = true;
      if (audio.duration) audio.currentTime = bar.value / 1000 * audio.duration;
      zeichnen();
    });
    bar.addEventListener('change', function () { ziehen = false; });

    zeichnen();
  })();
  </script>
