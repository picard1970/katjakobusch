  <script>
  (function () {
    var btns   = Array.prototype.slice.call(document.querySelectorAll('.comic-panel__btn'));
    var dlg    = document.querySelector('.museum-zoom');
    var stage  = dlg.querySelector('.museum-zoom__buehne');
    var img    = dlg.querySelector('.museum-zoom__bild');
    var zahl   = dlg.querySelector('.comic-zoom__zaehler');
    if (!dlg.showModal) { return; }            // sehr alte Browser: Link öffnet einfach das große Bild

    var idx = 0, s = 1, tx = 0, ty = 0, maxS = 4;
    var pointers = new Map(), start = null, moved = false, lastTap = 0;
    var wisch = null;                          // Start einer Wischgeste (zum Blättern)

    function apply(anim) {
      img.style.transition = anim ? 'transform .25s ease' : 'none';
      img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
      img.style.cursor = s > 1 ? 'grab' : 'default';
    }
    function clamp() {
      var w = img.offsetWidth * s, h = img.offsetHeight * s;
      var mx = Math.max(0, (w - stage.clientWidth) / 2);
      var my = Math.max(0, (h - stage.clientHeight) / 2);
      tx = Math.min(mx, Math.max(-mx, tx));
      ty = Math.min(my, Math.max(-my, ty));
    }
    // auf Punkt (px,py) im Fenster zoomen, der Punkt bleibt stehen
    function zoomTo(ns, px, py, anim) {
      ns = Math.min(maxS, Math.max(1, ns));
      var r = stage.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (px == null) { px = cx; py = cy; }
      var k = ns / s;
      tx = (px - cx) - k * (px - cx - tx);
      ty = (py - cy) - k * (py - cy - ty);
      s = ns;
      if (s === 1) { tx = 0; ty = 0; }
      clamp(); apply(anim);
    }
    function reset() { s = 1; tx = 0; ty = 0; apply(false); }

    function show(i) {
      idx = Math.min(btns.length - 1, Math.max(0, i));   // Comic: vorne und hinten nicht herumspringen
      var b = btns[idx], small = b.querySelector('img');
      reset();
      img.src = small.currentSrc || small.src;   // sofort die kleine (schon geladene) Version
      img.alt = small.alt;
      zahl.textContent = (idx + 1) + ' / ' + btns.length;
      dlg.querySelector('.museum-zoom__vor').hidden  = idx === 0;
      dlg.querySelector('.museum-zoom__nach').hidden = idx === btns.length - 1;
      var full = new Image();
      full.onload = function () {
        if (btns[idx] !== b) return;
        img.src = full.src;
        // so weit zoomen, bis ein Bildpixel einem Bildschirmpixel entspricht – mindestens 3-fach
        maxS = Math.max(3, full.naturalWidth / img.offsetWidth);
      };
      full.src = b.getAttribute('href');
    }

    btns.forEach(function (b, i) {
      b.addEventListener('click', function (e) { e.preventDefault(); show(i); dlg.showModal(); });
    });
    dlg.querySelector('.museum-zoom__zu').addEventListener('click', function () { dlg.close(); });
    dlg.querySelector('.museum-zoom__vor').addEventListener('click', function () { show(idx - 1); });
    dlg.querySelector('.museum-zoom__nach').addEventListener('click', function () { show(idx + 1); });
    dlg.querySelector('[data-zoom="in"]').addEventListener('click', function () { zoomTo(s * 1.6, null, null, true); });
    dlg.querySelector('[data-zoom="out"]').addEventListener('click', function () { zoomTo(s / 1.6, null, null, true); });
    dlg.querySelector('[data-zoom="reset"]').addEventListener('click', function () { zoomTo(1, null, null, true); });
    dlg.addEventListener('close', function () { img.removeAttribute('src'); });

    // Mausrad / Trackpad
    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomTo(s * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY, false);
    }, { passive: false });

    // Doppelklick (Maus)
    img.addEventListener('dblclick', function (e) {
      zoomTo(s > 1.05 ? 1 : 2.5, e.clientX, e.clientY, true);
    });

    // Ziehen, Pinch, Doppel-Tipp, Wischen zum Blättern
    stage.addEventListener('pointerdown', function (e) {
      stage.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = false;
      start = snapshot();
      wisch = (pointers.size === 1 && s === 1) ? { x: e.clientX, y: e.clientY } : null;
    });
    stage.addEventListener('pointermove', function (e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      var now = snapshot();
      if (now.n > 1) wisch = null;
      if (!start || now.n !== start.n) { start = now; return; }
      if (Math.abs(now.mx - start.mx) + Math.abs(now.my - start.my) > 4 || now.n > 1) moved = true;
      if (now.n === 2 && start.d > 0) {
        var ns = Math.min(maxS, Math.max(1, start.s * now.d / start.d));
        s = start.s; tx = start.tx; ty = start.ty;
        zoomTo(ns, start.mx, start.my, false);
        tx += now.mx - start.mx; ty += now.my - start.my; clamp(); apply(false);
      } else if (now.n === 1 && s > 1) {
        tx = start.tx + (now.mx - start.mx);
        ty = start.ty + (now.my - start.my);
        clamp(); apply(false);
        img.style.cursor = 'grabbing';
      }
    });
    function up(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      start = pointers.size ? snapshot() : null;
      if (pointers.size) return;
      // seitlich gewischt (nicht gezoomt) → blättern
      if (wisch && s === 1) {
        var dx = e.clientX - wisch.x, dy = e.clientY - wisch.y;
        wisch = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { show(idx + (dx < 0 ? 1 : -1)); return; }
      }
      if (moved) return;
      var t = Date.now();
      if (e.pointerType !== 'mouse' && t - lastTap < 300) {     // Doppel-Tipp
        zoomTo(s > 1.05 ? 1 : 2.5, e.clientX, e.clientY, true); lastTap = 0; return;
      }
      lastTap = t;
      // Tipp neben das Bild schließt (nur wenn nicht gezoomt)
      if (e.target === stage && s === 1) dlg.close();
    }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);

    function snapshot() {
      var p = Array.from(pointers.values()), n = p.length;
      var mx = 0, my = 0;
      p.forEach(function (q) { mx += q.x; my += q.y; });
      mx /= n || 1; my /= n || 1;
      var d = n > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0;
      return { n: n, mx: mx, my: my, d: d, s: s, tx: tx, ty: ty };
    }

    // Tastatur
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') show(idx + 1);
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === '+' || e.key === '=') zoomTo(s * 1.6, null, null, true);
      else if (e.key === '-') zoomTo(s / 1.6, null, null, true);
      else if (e.key === '0') zoomTo(1, null, null, true);
    });
    window.addEventListener('resize', function () { if (dlg.open) { clamp(); apply(false); } });
  })();
  </script>
</body>
</html>
